name: PR Validation

on:
  pull_request:
    types: [opened, edited, reopened, labeled, unlabeled, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  validate:
    name: Governance checks
    runs-on: ubuntu-latest
    steps:
      - name: Issue link, approval, and single type label
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const errors = [];

            // 1) PR body must reference an issue via a closing keyword.
            const refMatch = body.match(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i);
            if (!refMatch) {
              errors.push('PR body must link an issue with `Closes #N` / `Fixes #N` / `Resolves #N`.');
            }

            // 2) The linked issue must carry the `status:approved` label.
            if (refMatch) {
              const issue_number = parseInt(refMatch[1], 10);
              try {
                const { data: issue } = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                });
                const labels = (issue.labels || []).map(l => (typeof l === 'string' ? l : l.name));
                if (!labels.includes('status:approved')) {
                  errors.push(`Linked issue #${issue_number} must have the \`status:approved\` label (found: ${labels.join(', ') || 'none'}).`);
                }
              } catch (e) {
                errors.push(`Could not read linked issue #${issue_number}: ${e.message}`);
              }
            }

            // 3) The PR must carry exactly one `type:*` label.
            const typeLabels = (pr.labels || []).map(l => l.name).filter(n => n.startsWith('type:'));
            if (typeLabels.length !== 1) {
              errors.push(`PR must have exactly one \`type:*\` label (found ${typeLabels.length}: ${typeLabels.join(', ') || 'none'}).`);
            }

            if (errors.length) {
              core.setFailed(errors.join('\n'));
            } else {
              core.info('Governance checks passed.');
            }
